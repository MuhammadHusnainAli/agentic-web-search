name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch/PR cancels the run it supersedes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      # Type-checks the browser-less build; the stub has no behaviour of its
      # own worth a second full test compile.
      - run: cargo clippy --all-targets --no-default-features -- -D warnings
      - run: cargo test --all-targets

  # Runs alongside `check` instead of after it.
  docker:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [lite, full]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: ${{ matrix.target }}
          # Smoke-test image only: skip fat LTO. Release images use the default.
          build-args: CARGO_PROFILE=ci
          tags: agentic-web-search:${{ matrix.target }}
          load: true
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}
      - name: Smoke test
        run: |
          docker run -d --name aws -p 8080:8080 -e API_KEYS=ci-smoke-test-key-0123456789 agentic-web-search:${{ matrix.target }}
          for i in $(seq 1 30); do curl -sf localhost:8080/health && break; sleep 1; done
          curl -sf localhost:8080/ready
          test "$(curl -s -o /dev/null -w '%{http_code}' localhost:8080/v1/search?q=x)" = "401"
          docker rm -f aws
