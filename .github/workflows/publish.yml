name: Publish

# Builds the binary-only `lite` image and pushes it to Docker Hub as
# <username>/agentic-web-search:YYYY-MM-DD-vN and :latest. N restarts at 1 each
# day (Asia/Karachi) and goes up by one per publish.
on:
  workflow_dispatch:

# Runs one at a time, so two publishes can't pick the same version.
concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # DOCKERHUB_USERNAME and DOCKERHUB_TOKEN are environment secrets.
    environment: agentic-web-search
    permissions:
      contents: write # pushes the version as a git tag
    env:
      IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/agentic-web-search
    steps:
      - uses: actions/checkout@v4

      # Git tags record which versions exist, and which commit each one is.
      - name: Pick version
        id: version
        shell: bash
        run: |
          today=$(TZ=Asia/Karachi date +%F)
          last=$(git ls-remote --tags --refs origin "refs/tags/${today}-v*" \
            | sed -nE 's#.*-v([0-9]+)$#\1#p' | sort -n | tail -n 1)
          echo "tag=${today}-v$(( ${last:-0} + 1 ))" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Default CARGO_PROFILE: the fat LTO release build, which CI never tests.
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: lite
          tags: |
            ${{ env.IMAGE }}:${{ steps.version.outputs.tag }}
            ${{ env.IMAGE }}:latest
          load: true
          cache-from: type=gha,scope=publish-lite
          cache-to: type=gha,mode=max,scope=publish-lite

      - name: Smoke test
        run: |
          docker run -d --name aws -p 8080:8080 -e API_KEYS=ci-smoke-test-key-0123456789 "$IMAGE:latest"
          for i in $(seq 1 30); do curl -sf localhost:8080/health && break; sleep 1; done
          curl -sf localhost:8080/ready
          test "$(curl -s -o /dev/null -w '%{http_code}' localhost:8080/v1/search?q=x)" = "401"
          docker rm -f aws

      # Before the image push: a taken tag fails here instead of overwriting an image.
      - name: Tag commit
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          git tag "$TAG"
          git push origin "refs/tags/$TAG"

      - name: Push image
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          docker push "$IMAGE:$TAG"
          docker push "$IMAGE:latest"
          echo "Published \`$TAG\`" >> "$GITHUB_STEP_SUMMARY"
